<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio</title>
<style>

  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  /* ---------- Contenedor de las dos columnas ---------- */
  .contenedor {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .columna {
    flex: 1;
    min-width: 300px;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 20px;
    background-color: #fff;
  }

  /* ---------- Columna izquierda: Portafolio ---------- */
  .columna h2 {
    margin-top: 0;
  }

  #titulo-portafolio {
    color: #f4a300; 
  }

  .presentacion {
    display: flex;
    gap: 15px;
    align-items: center;
    margin-bottom: 25px;
  }

  .foto-placeholder {
    width: 90px;
    height: 90px;
    border: 2px solid #333;
    flex-shrink: 0;
  }

  .lineas-texto {
    flex: 1;
  }

  .lineas-texto span {
    display: block;
    border-bottom: 1px solid #333;
    height: 14px;
    margin-bottom: 8px;
  }

  /* ---------- Listas (Historial académico / laboral) ---------- */
  ul.lista {
    list-style: none;
    padding-left: 0;
    margin: 10px 0 20px 0;
  }

  ul.lista li {
    padding: 4px 0;
    border-bottom: 1px dashed #ccc;
  }

  ul.lista li::before {
    content: "- ";
  }

  /* ---------- Formulario para agregar elementos ---------- */
  .agregar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .agregar input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #999;
    border-radius: 4px;
  }

  .agregar button {
    padding: 6px 14px;
    border: 1px solid #333;
    background-color: #eee;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  .agregar button:hover {
    background-color: #ddd;
  }

  /* ---------- Pie de página ---------- */
  footer {
    text-align: center;
    margin-top: 30px;
    font-size: 14px;
    color: #666;
  }
</style>
</head>
<body>

  <h1>Portafolio Personal</h1>

  <div class="contenedor">

    <!-- ===================== COLUMNA IZQUIERDA: PORTAFOLIO ===================== -->
    <section class="columna">
      <h2 id="titulo-portafolio">Portafolio</h2>

      <div class="presentacion">
        <div class="foto-placeholder"></div>
        <div class="lineas-texto">
          <p>Presentación</p>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <h3>Historial Académico</h3>
      <ul class="lista" id="lista-academico">
        <li>Colegio</li>
        <li>Universidad</li>
        <li>Cursos y Diplomados</li>
      </ul>

      <div class="agregar">
        <button id="btn-agregar-academico">+ Agregar</button>
        <input type="text" id="input-academico" >
      </div>
    </section>

    <!-- ===================== COLUMNA DERECHA: HISTORIAL LABORAL ===================== -->
    <section class="columna">
      <h2>Historial Laboral</h2>

      <ul class="lista" id="lista-laboral">
        <li>Monitor Académico</li>
        <li>Consultor</li>
      </ul>

      <div class="agregar">
        <button id="btn-agregar-laboral">+ Agregar</button>
        <input type="text" id="input-laboral" placeholder="Ej: Practicante">
      </div>
    </section>

  </div>

  <footer id="footer">Footer, 2026</footer>

  <script>
    /* =========================================================
       Lógica de manipulación del DOM
       ========================================================= */

    // Función genérica para agregar un ítem a una lista <ul>
    function agregarItem(idLista, idInput) {
      const input = document.getElementById(idInput);
      const texto = input.value.trim();

      if (texto === "") {
        alert("Escribe algo antes de agregar.");
        return;
      }

      // Crear el <li> y llevarlo al DOM
      const li = document.createElement("li");
      li.textContent = texto;

      const lista = document.getElementById(idLista);
      lista.appendChild(li);

      // Limpiar el input
      input.value = "";
    }

    // Botón "Agregar" del Historial Académico
    document.getElementById("btn-agregar-academico")
      .addEventListener("click", function () {
        agregarItem("lista-academico", "input-academico");
      });

    // Botón "Agregar" del Historial Laboral
    document.getElementById("btn-agregar-laboral")
      .addEventListener("click", function () {
        agregarItem("lista-laboral", "input-laboral");
      });

    // Footer dinámico con el año actual
    document.getElementById("footer").textContent =
      "Footer, " + new Date().getFullYear();
  </script>

</body>
</html>
